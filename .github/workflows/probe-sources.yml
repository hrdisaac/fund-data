# One-off probe of historical valuation data sources. Run it by hand from the Actions tab.
# Put this file at:  .github/workflows/probe-sources.yml   (and scripts/probe_sources.py)
name: Probe data sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install xlrd
      - name: Probe (read-only; writes nothing)
        run: python scripts/probe_sources.py
